version: 2
updates:
  - package-ecosystem: "npm"
    directory:
      - "/"
      - "/packages/shinkom"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@mdn/browser-compat-data"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "caniuse-db"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      
      
