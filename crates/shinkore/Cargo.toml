[package]
name = "shinkore"
version = "0.1.0"
authors = ["OneilNvM <oneil324@outlook.com>"]
description = "A parsing and data processing library for the Shinkom package using WebAssembly"
repository = "https://github.com/OneilNvM/shinkom/tree/master/crates/shinkore"
license = "MIT"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lol_html = "3.0.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ['derive'] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
thiserror = "2.0.18"
version-compare = "0.2.1"
wasm-bindgen = "0.2.126"
shinkore-hints = { path = "../shinkore-hints", optional = true }
shinkore-types = { path = "../shinkore-types" }
cssparser = "0.37.0"

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "preprocess_bench"
harness = false

[[bench]]
name = "engine_bench"
harness = false

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[features]
default = ["hints"]
hints = ["dep:shinkore-hints"]
